include classpath("application.conf")

queues {
   background-processing{
        defaultVisibilityTimeout = 10 seconds
        delay = 5 seconds
        receiveMessageWait = 0 seconds
        deadLettersQueue {
            name = "queue-dead-letters"
            maxReceiveCount = 3 // from 1 to 1000
        }
    },
	delay-processing{
		defaultVisibilityTimeout = 10 seconds
		delay = 5 seconds
		receiveMessageWait = 0 seconds
		deadLettersQueue {
			name = "queue-dead-letters"
			maxReceiveCount = 3 // from 1 to 1000
		}
    }
    queue-dead-letters{ }
}